service_defaults: &service_defaults
  type: ClusterIP
  port: 80
  targetPort: 8080

resources_small: &resources_small
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

http_probe: &http_probe
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10
