apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: payments
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: payments
    app.kubernetes.io/managed-by: yamll
  name: payments-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-api
  template:
    metadata:
      namespace: payments
      labels:
        app.kubernetes.io/name: payments-api
        app.kubernetes.io/part-of: payments
        app.kubernetes.io/managed-by: yamll
    spec:
      serviceAccountName: payments-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          name: api
          image: ghcr.io/example/payments-api:v1.4.2
