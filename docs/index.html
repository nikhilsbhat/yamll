<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Yamll documentation: import, merge, trace, lint, lock, and explain YAML dependencies.">
  <title>Yamll Documentation</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #116149;
      --base-font-size: 16px;
      --sidebar-width: 300px;
    }

    body {
      color: #1d2623;
    }

    .app-name-link img {
      max-width: 120px;
    }

    .markdown-section {
      max-width: 920px;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: #10241e;
      font-weight: 700;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section code {
      border-radius: 4px;
    }

    .cover-main h1 {
      font-weight: 800;
    }

    .cover-main blockquote {
      color: #40544e;
    }

    .sidebar ul li.active > a {
      border-right: 3px solid var(--theme-color);
      color: var(--theme-color);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="app">Loading Yamll docs...</div>
  <script>
    window.$docsify = {
      name: 'Yamll',
      repo: 'nikhilsbhat/yamll',
      homepage: 'README.md',
      loadSidebar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 2,
      maxLevel: 3,
      search: {
        paths: 'auto',
        placeholder: 'Search docs',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
